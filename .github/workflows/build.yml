name: Build & Sign APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Generate Gradle Wrapper
        run: gradle wrapper
      
      - name: Build with Gradle
        run: ./gradlew assembleDebug
      
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"
      
      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"
      
      - name: Sign APK with apksigner
        run: |
          APK=${{ steps.apk.outputs.apk }}
          SIGNED=$(dirname $APK)/MyInsta-signed.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out $SIGNED $APK
          echo "Signed APK: $SIGNED"
      
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MyInsta-Signed-APK
          path: ${{ steps.apk.outputs.apk }}
          retention-days: 30
